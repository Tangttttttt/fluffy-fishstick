<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天气查询软件</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #FFB6C1, #87CEEB);
        }
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #FFB6C1;
            border-radius: 4px;
        }
        button {
            background-color: #FFB6C1;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #FF69B4;
        }
        .weather-info {
            margin-top: 20px;
            padding: 10px;
            background-color: #FFFACD;
            border-radius: 4px;
        }
        .error {
            color: #FF69B4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>天气查询软件</h1>
        <input type="text" id="cityInput" placeholder="请输入城市名称" />
        <button onclick="getWeather()">查询天气</button>
        <div id="weatherResult" class="weather-info" style="display: none;"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                alert('请输入城市名称');
                return;
            }

            const resultDiv = document.getElementById('weatherResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '正在查询...';

            try {
                const response = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=j1&lang=zh`);
                if (!response.ok) {
                    throw new Error('查询失败');
                }
                const data = await response.json();

                const current = data.current_condition[0];
                const location = data.nearest_area[0];

                const weatherHtml = `
                    <h2>${location.areaName[0].value}</h2>
                    <p><strong>温度：</strong>${current.temp_C}°C</p>
                    <p><strong>天气：</strong>${current.weatherDesc[0].value}</p>
                    <p><strong>湿度：</strong>${current.humidity}%</p>
                    <p><strong>风速：</strong>${current.windspeedKmph} km/h</p>
                    <p><strong>更新时间：</strong>${current.observation_time}</p>
                `;

                resultDiv.innerHTML = weatherHtml;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">查询失败：${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
